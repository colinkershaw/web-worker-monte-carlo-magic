<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavenly Inferno: Monte Carlo Multi-Core Simulator</title>
    <style>
        :root { --primary: #722f37; --bg: #fdfaf6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; padding: 2rem; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .controls { display: flex; gap: 1rem; margin-bottom: 2rem; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 120px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .stat-card { background: #f8f9fa; padding: 1.5rem; border-left: 5px solid var(--primary); border-radius: 4px; }
        .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h1>Heavenly Inferno Simulation</h1>
    <p>Simulating the probability of hitting <strong>Mardu Colors (RWB)</strong> by Turn 4 to cast <em>Kaalia of the Vast</em>.</p>

    <div class="controls">
        <div class="input-group">
            <label>Total Iterations</label>
            <input id="iterInput" type="number" value="1000000">
        </div>
        <button id="runBtn">Start Simulation</button>
    </div>

    <div id="progressBar" class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <p id="status">Ready.</p>

    <div id="results">
        <div class="stat-card">
            <strong>Success Rate</strong>
            <div id="resSuccess" style="font-size: 2rem;">--</div>
        </div>
        <div class="stat-card">
            <strong>Avg Lands (Turn 4)</strong>
            <div id="resLands" style="font-size: 2rem;">--</div>
        </div>
    </div>
</div>

<script id="worker-logic" type="text/plain">
    // Domain Models
    class Card {
        constructor(name, types, colors = []) {
            this.name = name;
            this.types = types;
            this.produces = colors;
        }
    }

    class Deck {
        constructor(cards) {
            this.cards = [...cards];
        }
        shuffle() {
            for (let i = this.cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
            }
            return this;
        }
        draw(count) {
            return this.cards.splice(0, count);
        }
    }

    class GameSimulation {
        constructor(deckList) {
            this.originalList = deckList;
        }

        runOnce() {
            const deck = new Deck(this.originalList).shuffle();
            const hand = deck.draw(7);
            const turn4Field = [...hand, ...deck.draw(3)]; // Draw for T1, T2, T3 (assuming on the play)

            const lands = turn4Field.filter(c => c.types.includes('Land'));
            const colorsProduced = new Set();
            lands.forEach(l => l.produces.forEach(color => colorsProduced.add(color)));

            // Success = Can we produce R, W, and B?
            const canCastKaalia = ['R', 'W', 'B'].every(c => colorsProduced.has(c));

            return {
                success: canCastKaalia,
                landCount: lands.length
            };
        }
    }

    self.onmessage = function(e) {
        const { iterations, deckList } = e.data;
        const sim = new GameSimulation(deckList);
        let successes = 0;
        let totalLands = 0;

        for (let i = 1; i <= iterations; i++) {
            const result = sim.runOnce();
            if (result.success) successes++;
            totalLands += result.landCount;

            if (i % Math.max(1, Math.floor(iterations / 10)) === 0) {
                self.postMessage({ type: 'progress', percent: (i / iterations) * 100 });
            }
        }

        self.postMessage({
            type: 'result',
            successRate: (successes / iterations) * 100,
            avgLands: totalLands / iterations
        });
    };
</script>

<script>
  // --- Deck Definition ---
  // Simplified for the simulation: focus on Lands and their color production
  const createDeck = () => {
    const deck = [];
    const add = (name, count, types, colors) => {
      for(let i=0; i<count; i++) deck.push({name, types, produces: colors});
    };

    // Mana Base (38 Lands)
    add('Plains', 8, ['Land', 'Basic'], ['W']);
    add('Swamp', 8, ['Land', 'Basic'], ['B']);
    add('Mountain', 8, ['Land', 'Basic'], ['R']);
    add('Command Tower', 1, ['Land'], ['R', 'W', 'B']);
    add('Akoum Refuge', 1, ['Land'], ['B', 'R']);
    add('Boros Garrison', 1, ['Land'], ['R', 'W']);
    add('Orzhov Basilica', 1, ['Land'], ['W', 'B']);
    add('Rakdos Carnarium', 1, ['Land'], ['B', 'R']);
    add('Rupture Spire', 1, ['Land'], ['R', 'W', 'B']);
    add('Vivid Meadow', 1, ['Land'], ['W', 'B', 'R']); // Simplified vivids
    add('Bojuka Bog', 1, ['Land'], ['B']);
    add('Evolving Wilds', 1, ['Land'], ['R', 'W', 'B']); // Simplified fetch
    add('Molten Slagheap', 1, ['Land'], ['B', 'R']);
    add('Zoetic Cavern', 1, ['Land'], ['C']);
    add('Barren Moor', 1, ['Land'], ['B']);
    add('Forgotten Cave', 1, ['Land'], ['R']);
    add('Secluded Steppe', 1, ['Land'], ['W']);

    // Fill remaining 61 slots with non-lands
    add('Spell', 61, ['NonLand'], []);

    return deck;
  };

  // --- Main UI Logic ---
  const runBtn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const fill = document.getElementById('progressFill');

  // Create Worker from Blob
  const workerCode = document.getElementById('worker-logic').textContent;
  const workerUrl = URL.createObjectURL(new Blob([workerCode], {type: 'application/javascript'}));

  runBtn.onclick = () => {
    const totalIterations = parseInt(document.getElementById('iterInput').value);
    const numWorkers = navigator.hardwareConcurrency || 4;
    const iterationsPerWorker = Math.floor(totalIterations / numWorkers);

    let workersFinished = 0;
    let aggregateSuccessRate = 0;
    let aggregateAvgLands = 0;
    const workerProgress = new Array(numWorkers).fill(0);

    runBtn.disabled = true;
    status.innerText = `Simulating on ${numWorkers} cores...`;

    for (let i = 0; i < numWorkers; i++) {
      const worker = new Worker(workerUrl);
      const iters = (i === numWorkers - 1)
        ? totalIterations - (iterationsPerWorker * (numWorkers - 1))
        : iterationsPerWorker;

      worker.postMessage({ iterations: iters, deckList: createDeck() });

      worker.onmessage = (e) => {
        if (e.data.type === 'progress') {
          workerProgress[i] = e.data.percent;
          const totalPercent = workerProgress.reduce((a, b) => a + b, 0) / numWorkers;
          fill.style.width = `${totalPercent}%`;
        } else if (e.data.type === 'result') {
          workersFinished++;
          // Weight the results based on actual work done by this worker
          aggregateSuccessRate += (e.data.successRate * (iters / totalIterations));
          aggregateAvgLands += (e.data.avgLands * (iters / totalIterations));

          worker.terminate();

          if (workersFinished === numWorkers) {
            document.getElementById('resSuccess').innerText = aggregateSuccessRate.toFixed(2) + '%';
            document.getElementById('resLands').innerText = aggregateAvgLands.toFixed(2);
            status.innerText = `Complete (via ${numWorkers} workers).`;
            runBtn.disabled = false;
          }
        }
      };
    }
  };
</script>
</body>
</html>
