<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana Velocity Dashboard</title>
    <style>
        :root {
            --accent: #00e5ff; --any: #94a3b8; --white: #ffffff;
            --black: #000000; --red: #ff3131; --blue: #3b82f6; --green: #22c55e;
            --bg: #0f172a; --card: #1e293b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #f1f5f9; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
        .title-row { display: flex; justify-content: space-between; align-items: center; }
        .controls { display: grid; grid-template-columns: auto 1fr 1fr 1fr auto; gap: 1rem; background: var(--card); padding: 1rem; border-radius: 12px; border: 1px solid #334155; align-items: end; }
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        input, textarea { background: #0f172a; border: 1px solid #475569; color: white; padding: 8px; border-radius: 6px; }
        textarea { resize: vertical; font-family: monospace; }
        button.action-btn { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; height: fit-content; align-self: end; }
        
        /* Deck Size Selector Styles */
        .deck-size-group { display: flex; gap: 12px; align-items: end; padding-bottom: 4px; }
        .deck-btn {
            position: relative;
            width: 42px; height: 56px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 4px;
            color: #94a3b8;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .deck-btn::before, .deck-btn::after {
            content: ''; position: absolute;
            background: #0f172a; border: 1px solid #475569; border-radius: 3px;
            z-index: -1; transition: all 0.2s;
        }
        .deck-btn::before { top: -4px; left: 2px; right: -4px; bottom: 2px; }
        .deck-btn::after { top: -8px; left: 4px; right: -6px; bottom: 6px; }
        
        .deck-btn.active {
            border-color: var(--accent); color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2) inset;
        }
        .deck-btn.active::before, .deck-btn.active::after { border-color: var(--accent); }

        /* Multi-Thread Visuals */
        #workerContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 2rem; }
        .worker-row { background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid #334155; font-size: 0.7rem; }
        .mini-progress { height: 4px; background: #0f172a; border-radius: 2px; overflow: hidden; margin-top: 5px; }
        .mini-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; box-shadow: 0 0 8px var(--accent); }

        .turns-container { display: flex; flex-direction: column; gap: 2rem; }
        .turn-card { background: var(--card); padding: 2rem; border-radius: 16px; border: 1px solid #334155; }
        .turn-header { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .bar-outer { background: #0f172a; height: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #334155; margin-bottom: 2rem; }
        .bar-inner { height: 100%; background: linear-gradient(90deg, #3a7bd5, #00e5ff); width: 0%; transition: width 0.8s; }
        
        .turn-details { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
        
        /* Wheel Styles */
        .wheel-container { position: relative; width: 250px; height: 250px; margin: 0 auto; }
        .wheel-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .slice-bg { fill: rgba(255, 255, 255, 0.05); stroke: #334155; stroke-width: 0.5; }
        .slice-fill { transition: d 0.5s ease-out; opacity: 0.9; }
        .slice-outline { fill: none; stroke-width: 2; }
        
        .wheel-labels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .label { position: absolute; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; transform: translate(-50%, -50%); }
        .label-pct { display: block; color: var(--accent); font-size: 1.1rem; }

        .failure-section { display: flex; flex-direction: column; gap: 0.8rem; justify-content: center; }
        .fail-row { display: flex; flex-direction: column; gap: 0.2rem; }
        .fail-text { display: flex; justify-content: space-between; font-size: 0.85rem; }
        .fail-bar-outer { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; }
        .fail-bar-inner { height: 100%; background: #ff3131; width: 0%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-row">
            <h1>MANA VELOCITY <span style="color:var(--accent)">ANALYZER</span></h1>
        </div>
        <div class="controls">
            <div class="control-group">
                <label style="margin-bottom: 8px;">Format</label>
                <div class="deck-size-group">
                    <button class="deck-btn" data-size="60" onclick="setDeckSize(60)">60</button>
                    <button class="deck-btn active" data-size="100" onclick="setDeckSize(100)">100</button>
                </div>
            </div>
            <div class="control-group">
                <label for="targetInput">Target Cost (e.g., 1 W B R)</label>
                <input id="targetInput" type="text" value="1 W B R" placeholder="1 W B R U G">
            </div>
            <div class="control-group">
                <label for="deckInput">Deck (e.g., 10xW, 4xWB)</label>
                <textarea id="deckInput" rows="4">8xW
8xB
8xR
12xWBR
2xWR</textarea>
            </div>
            <div class="control-group">
                <label for="iterInput">Iterations</label>
                <input id="iterInput" type="number" value="100000">
            </div>
            <button id="runBtn" class="action-btn">INITIATE ENGINE</button>
        </div>
    </div>

    <div id="workerContainer"></div>
    <div id="turnsContainer" class="turns-container"></div>
</div>

<!-- SHARED MANA LOGIC FOR MAIN THREAD (TESTING) AND WORKER -->
<script id="mana-logic" type="text/javascript">
    /**
     * Determines if a set of lands can pay a specific mana cost.
     * Uses recursive backtracking to handle dual/tri lands correctly.
     * @param {Array<Array<string>>} lands - Array of arrays, e.g., [['W'], ['W','U'], ['W','U','B','R','G']]
     * @param {Array<string>} targetColors - e.g., ['W', 'W', 'U']
     * @param {number} targetGeneric - e.g., 2
     */
    function canPay(lands, targetColors, targetGeneric) {
        // If we have satisfied all colored pips, check if remaining lands can cover generic
        if (targetColors.length === 0) {
            return lands.length >= targetGeneric;
        }
        
        const colorNeeded = targetColors[0];
        const remainingColors = targetColors.slice(1);
        
        // Try to pay the current colored pip with each available land
        for (let i = 0; i < lands.length; i++) {
            if (lands[i].includes(colorNeeded) || lands[i].includes('Any')) {
                // Create a new array without the land we just used
                const remainingLands = lands.filter((_, idx) => idx !== i);
                
                // Recurse to see if the rest of the cost can be paid
                if (canPay(remainingLands, remainingColors, targetGeneric)) {
                    return true;
                }
            }
        }
        return false;
    }

    function parseTargetCost(str) {
        let tokens = str.toUpperCase().match(/([0-9]+|[WUBRGC])/g) || [];
        let generic = 0;
        let colors = [];
        let uniqueColors = new Set();
        tokens.forEach(t => {
            if (!isNaN(parseInt(t))) generic += parseInt(t);
            else {
                colors.push(t);
                uniqueColors.add(t);
            }
        });
        return { generic, colors, uniqueColors: Array.from(uniqueColors), total: generic + colors.length };
    }
</script>

<script id="worker-logic" type="text/plain">
    self.onmessage = function(e) {
        const { iterations, deckList, targetCost } = e.data;
        
        let turnData = Array(9).fill(null).map(() => ({
            successes: 0,
            colorHits: Object.fromEntries(targetCost.uniqueColors.map(c => [c, 0])),
            failReasons: { land: 0, ...Object.fromEntries(targetCost.uniqueColors.map(c => [c, 0])) }
        }));

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        for (let i = 1; i <= iterations; i++) {
            let deck = shuffle([...deckList]);
            let hand = deck.splice(0, 7);
            let landsOnBoard = [];
            let successFound = false;

            for (let t = 1; t <= 8; t++) {
                if (t > 1) hand.push(deck.pop());
                const landIdx = hand.findIndex(c => c.types.includes('Land'));
                if (landIdx > -1) {
                    const land = hand.splice(landIdx, 1)[0];
                    landsOnBoard.push(land.produces);
                }

                if (successFound) {
                    turnData[t].successes++;
                    targetCost.uniqueColors.forEach(c => turnData[t].colorHits[c]++);
                    continue;
                }

                const hasEnoughLands = landsOnBoard.length >= targetCost.total;
                const canCast = canPay(landsOnBoard, targetCost.colors, targetCost.generic);

                // Track partial hits for pie chart (greedy estimation just for visual tracking)
                let greedyPool = new Set();
                landsOnBoard.forEach(l => l.forEach(c => greedyPool.add(c)));
                targetCost.uniqueColors.forEach(c => {
                    if (greedyPool.has(c)) turnData[t].colorHits[c]++;
                });

                if (canCast) {
                    turnData[t].successes++;
                    successFound = true;
                } else {
                    if (!hasEnoughLands) {
                        turnData[t].failReasons.land++;
                    } else {
                        // Estimate missing color for waterfall
                        targetCost.uniqueColors.forEach(c => {
                            if (!greedyPool.has(c)) turnData[t].failReasons[c]++;
                        });
                    }
                }
            }
            if (i % Math.floor(iterations / 20) === 0) self.postMessage({ type: 'progress', percent: (i/iterations)*100 });
        }
        self.postMessage({ type: 'result', turnData });
    };
</script>

<script>
  let currentDeckSize = 100;

  function setDeckSize(size) {
      currentDeckSize = size;
      document.querySelectorAll('.deck-btn').forEach(btn => {
          if (parseInt(btn.dataset.size) === size) btn.classList.add('active');
          else btn.classList.remove('active');
      });
  }

  // TDD Test Suite (Runs only via console)
  window.runTests = function() {
      console.log("%c Running Mana Logic Tests...", "color: #00e5ff; font-weight: bold; font-size: 14px;");
      let passed = 0, failed = 0;
      function assert(name, condition) {
          if (condition) { console.log("✅ " + name); passed++; }
          else { console.error("❌ " + name); failed++; }
      }
      
      // Test 1: Schrödinger's Mana Bug
      assert("1 Command Tower cannot pay W U", !canPay([['W','U','B','R','G']], ['W','U'], 0));
      // Test 2: Multiple Pips Bug
      assert("1 Plains, 1 Island cannot pay W W U", !canPay([['W'],['U']], ['W','W','U'], 0));
      // Test 3: Complex Bipartite Matching
      assert("Azorius Chancery, Dimir Aqueduct, Plains CAN pay W U B", canPay([['W','U'],['U','B'],['W']], ['W','U','B'], 0));
      assert("Azorius Chancery, Dimir Aqueduct CANNOT pay W U B", !canPay([['W','U'],['U','B']], ['W','U','B'], 0));
      // Test 4: Generic Costs
      assert("Overpaying generic cost works", canPay([['W'],['U'],['B']], ['W'], 1));
      assert("Colorless counts as generic", canPay([['C'],['W']], ['W'], 1));
      
      console.log(`%c Tests complete. ${passed} passed, ${failed} failed.`, `color: ${failed === 0 ? '#22c55e' : '#ff3131'}`);
  };

  function polarToCartesian(cx, cy, r, angleDeg) {
    const rad = (angleDeg * Math.PI) / 180.0;
    return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
  }

  function describeArc(x, y, r, startAngle, endAngle) {
    if (r <= 0) return ""; 
    const start = polarToCartesian(x, y, r, endAngle);
    const end = polarToCartesian(x, y, r, startAngle);
    if (Math.abs(endAngle - startAngle) >= 360) {
        return `M ${x} ${y-r} A ${r} ${r} 0 1 1 ${x} ${y+r} A ${r} ${r} 0 1 1 ${x} ${y-r} Z`;
    }
    const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
    return ["M", x, y, "L", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y, "L", x, y, "Z"].join(" ");
  }

  const colorMap = { 'W': 'var(--white)', 'U': 'var(--blue)', 'B': 'var(--black)', 'R': 'var(--red)', 'G': 'var(--green)', 'C': 'var(--any)' };

  function parseDeck(str, totalSize) {
      const deck = [];
      const lines = str.toUpperCase().split('\n');
      lines.forEach(line => {
          let match = line.match(/([0-9]+)X\s*([WUBRGC]+)/);
          if (match) {
              const count = parseInt(match[1]);
              const produces = match[2].split('');
              for(let i=0; i<count; i++) deck.push({name: match[2], types:['Land'], produces});
          }
      });
      while(deck.length < totalSize - 1) deck.push({name:'Spell', types:['Spell'], produces:[]}); // -1 for Commander usually, roughly pads correctly
      return deck;
  }

  const runBtn = document.getElementById('runBtn');
  let workerUrl = null;

  runBtn.onclick = () => {
    if (workerUrl) URL.revokeObjectURL(workerUrl);
    
    // Inject the shared logic into the worker script
    const sharedLogic = document.getElementById('mana-logic').textContent;
    const workerLogic = document.getElementById('worker-logic').textContent;
    workerUrl = URL.createObjectURL(new Blob([sharedLogic + '\n' + workerLogic], {type: 'application/javascript'}));

    const totalIters = parseInt(document.getElementById('iterInput').value);
    const targetStr = document.getElementById('targetInput').value;
    const deckStr = document.getElementById('deckInput').value;
    
    const targetCost = parseTargetCost(targetStr);
    const deckList = parseDeck(deckStr, currentDeckSize);

    const cores = navigator.hardwareConcurrency || 4;
    const itersPer = Math.floor(totalIters / cores);
    let finished = 0;
    
    let aggData = Array(9).fill(null).map(() => ({
        successes: 0,
        colorHits: Object.fromEntries(targetCost.uniqueColors.map(c => [c, 0])),
        failReasons: { land: 0, ...Object.fromEntries(targetCost.uniqueColors.map(c => [c, 0])) }
    }));

    document.getElementById('workerContainer').innerHTML = '';
    document.getElementById('turnsContainer').innerHTML = '';
    runBtn.disabled = true;

    for (let i = 0; i < cores; i++) {
      const div = document.createElement('div');
      div.className = 'worker-row';
      div.innerHTML = `THREAD ${i+1}<div class="mini-progress"><div id="pb-${i}" class="mini-fill"></div></div>`;
      document.getElementById('workerContainer').appendChild(div);

      const w = new Worker(workerUrl);
      const iters = (i === cores-1) ? totalIters - (itersPer*(cores-1)) : itersPer;
      w.postMessage({ iterations: iters, deckList, targetCost });

      w.onmessage = (e) => {
        if (e.data.type === 'progress') document.getElementById(`pb-${i}`).style.width = e.data.percent + '%';
        if (e.data.type === 'result') {
          finished++;
          document.getElementById(`pb-${i}`).style.width = '100%';
          
          e.data.turnData.forEach((td, t) => {
              if (t === 0) return;
              aggData[t].successes += td.successes;
              for (let c in td.colorHits) aggData[t].colorHits[c] += td.colorHits[c];
              for (let f in td.failReasons) aggData[t].failReasons[f] += td.failReasons[f];
          });

          w.terminate();
          if (finished === cores) render(aggData, totalIters, targetCost);
        }
      };
    }
  };

function render(aggData, totalIters, targetCost) {
    runBtn.disabled = false;
    const container = document.getElementById('turnsContainer');
    
    for (let t = 1; t <= 8; t++) {
        const data = aggData[t];
        const succPct = ((data.successes / totalIters) * 100).toFixed(1);
        
        const colors = targetCost.uniqueColors;
        const anglePerColor = 360 / Math.max(1, colors.length);
        let wheelHtml = `<svg class="wheel-svg" viewBox="0 0 100 100">`;
        let labelsHtml = ``;
        
        colors.forEach((c, idx) => {
            const startAngle = idx * anglePerColor;
            const endAngle = (idx + 1) * anglePerColor;
            const hitPct = (data.colorHits[c] / totalIters) * 100;
            
            // FIX: Use square root of percentage to correctly scale area of the pie slice
            const rFill = 45 * Math.sqrt(hitPct / 100);
            const colorCode = colorMap[c] || 'var(--any)';
            
            wheelHtml += `
                <path class="slice-bg" d="${describeArc(50, 50, 45, startAngle, endAngle)}"/>
                <path class="slice-fill" fill="${colorCode}" d="${describeArc(50, 50, rFill, startAngle, endAngle)}"/>
                <path class="slice-outline" stroke="${colorCode}" d="${describeArc(50, 50, 45, startAngle, endAngle)}"/>
            `;
            
            const midAngle = startAngle + (anglePerColor / 2);
            const labelPos = polarToCartesian(50, 50, 58, midAngle);
            labelsHtml += `
                <div class="label" style="top: ${labelPos.y}%; left: ${labelPos.x}%;">
                    ${c} <span class="label-pct" style="color:${colorCode}">${hitPct.toFixed(0)}%</span>
                </div>`;
        });
        wheelHtml += `</svg>`;

        let waterfallHtml = '';
        const f = data.failReasons;
        const failCats = [{ label: 'Missing Lands', val: f.land, col: '#475569' }];
        colors.forEach(c => failCats.push({ label: `Missing ${c}`, val: f[c], col: colorMap[c] }));
        
        failCats.forEach(cat => {
            if (cat.val > 0) {
                const pct = ((cat.val / totalIters) * 100).toFixed(1);
                waterfallHtml += `
                    <div class="fail-row">
                        <div class="fail-text"><span>${cat.label}</span><span style="color:#ff3131">-${pct}%</span></div>
                        <div class="fail-bar-outer"><div class="fail-bar-inner" style="width:${pct}%; background:${cat.col}"></div></div>
                    </div>`;
            }
        });

        const turnCard = document.createElement('div');
        turnCard.className = 'turn-card';
        turnCard.innerHTML = `
            <div class="turn-header">
                <span>TURN ${t}</span>
                <span>${succPct}% CASTABLE</span>
            </div>
            <div class="bar-outer"><div class="bar-inner" style="width:${succPct}%"></div></div>
            <div class="turn-details">
                <div class="wheel-container">
                    ${wheelHtml}
                    <div class="wheel-labels">${labelsHtml}</div>
                </div>
                <div class="failure-section">
                    <h4 style="margin:0 0 10px 0; color:#ff3131">FAILURE ATTRIBUTION</h4>
                    ${waterfallHtml || '<div style="font-size:0.9rem; color:#94a3b8">No significant failures recorded.</div>'}
                </div>
            </div>
        `;
        container.appendChild(turnCard);
    }
}
</script>
</body>
</html>
