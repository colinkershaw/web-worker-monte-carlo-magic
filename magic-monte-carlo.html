<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavenly Inferno: Mana Velocity Dashboard</title>
    <style>
        :root {
            --accent: #00d2ff; --any: #94a3b8; --white: #f8fafc;
            --black: #1e293b; --red: #ef4444; --bg: #0f172a; --card: #1e293b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #f1f5f9; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .controls { display: flex; gap: 1rem; background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; }
        input { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 6px; width: 120px; }
        button { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Multi-Thread Visuals */
        #workerContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 2rem; }
        .worker-row { background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .thread-label { font-size: 0.75rem; color: var(--accent); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .mini-progress { height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; }
        .mini-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; box-shadow: 0 0 10px var(--accent); }

        .main-grid { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; }

        /* The Mana Wheel Card */
        .kaalia-card { background: var(--card); padding: 2rem; border-radius: 16px; border: 1px solid #334155; text-align: center; }
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 0 auto; }
        #manaWheel {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(
                    var(--any) 0% 25%,
                    var(--white) 25% 50%,
                    var(--black) 50% 75%,
                    var(--red) 75% 100%
            );
            mask: radial-gradient(transparent 55%, black 56%);
            -webkit-mask: radial-gradient(transparent 55%, black 56%);
            filter: grayscale(1) opacity(0.2);
            transition: filter 0.5s ease;
        }
        .wheel-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .t4-label { font-size: 2.5rem; font-weight: 900; color: var(--accent); }

        /* Turn Probability Chart */
        .chart-section { background: var(--card); padding: 2rem; border-radius: 16px; border: 1px solid #334155; }
        .turn-row { margin-bottom: 1.5rem; }
        .turn-meta { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
        .bar-outer { background: #0f172a; height: 24px; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        .bar-inner { height: 100%; background: linear-gradient(90deg, #3a7bd5, #00d2ff); width: 0%; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Heavenly Inferno <span style="color:var(--accent)">Engine</span></h1>
        <div class="controls">
            <div style="display:flex; flex-direction:column; gap:4px">
                <label style="font-size:0.7rem; color:#94a3b8">SIMULATION ITERATIONS</label>
                <input id="iterInput" type="number" value="100000">
            </div>
            <button id="runBtn">RECALCULATE VELOCITY</button>
        </div>
    </div>

    <div id="workerContainer"></div>

    <div class="main-grid">
        <div class="kaalia-card">
            <h3 style="margin-top:0">T4 Requirement</h3>
            <div class="wheel-container">
                <div id="manaWheel"></div>
                <div class="wheel-overlay">
                    <div id="resSuccess" class="t4-label">--%</div>
                    <div style="font-size:0.8rem; color:#94a3b8">RELIABILITY</div>
                </div>
            </div>
            <p style="font-size:0.9rem; margin-top:2rem; color:#94a3b8">The wheel saturates as specific color requirements are met across simulations.</p>
        </div>

        <div class="chart-section">
            <h3 style="margin-top:0">Cumulative Casting Probability</h3>
            <div id="turnChart"></div>
        </div>
    </div>
</div>

<script id="worker-logic" type="text/plain">
    self.onmessage = function(e) {
        const { iterations, deckList } = e.data;
        let turnSuccesses = Array(9).fill(0);
        let colorHitsAtT4 = { W:0, B:0, R:0, Any:0 };

        for (let i = 1; i <= iterations; i++) {
            let deck = [...deckList].sort(() => Math.random() - 0.5);
            let hand = deck.splice(0, 7);
            let colors = new Set();
            let landsOnBoard = 0;

            for (let t = 1; t <= 8; t++) {
                if (t > 1) hand.push(deck.pop());
                const landIdx = hand.findIndex(c => c.types.includes('Land'));
                if (landIdx > -1) {
                    const land = hand.splice(landIdx, 1)[0];
                    landsOnBoard++;
                    land.produces.forEach(c => colors.add(c));
                }

                if (colors.has('R') && colors.has('W') && colors.has('B') && landsOnBoard >= 4) {
                    for (let later = t; later <= 8; later++) turnSuccesses[later]++;
                    if (t === 4) { colorHitsAtT4.Any++; colorHitsAtT4.W++; colorHitsAtT4.B++; colorHitsAtT4.R++; }
                    break;
                }
                if (t === 4) {
                    if (landsOnBoard >= 1) colorHitsAtT4.Any++;
                    if (colors.has('W')) colorHitsAtT4.W++;
                    if (colors.has('B')) colorHitsAtT4.B++;
                    if (colors.has('R')) colorHitsAtT4.R++;
                }
            }
            if (i % Math.floor(iterations / 20) === 0) self.postMessage({ type: 'progress', percent: (i/iterations)*100 });
        }
        self.postMessage({ type: 'result', turnSuccesses, colorHitsAtT4, total: iterations });
    };
</script>

<script>
  const createDeck = () => {
    const deck = [];
    const add = (n, c, col) => { for(let i=0; i<c; i++) deck.push({name:n, types:['Land'], produces:col}); };
    add('Plains', 8, ['W']); add('Swamp', 8, ['B']); add('Mountain', 8, ['R']);
    add('Tower', 1, ['R', 'W', 'B']); add('Spire', 1, ['R', 'W', 'B']);
    add('Duals', 12, ['R', 'W', 'B']); // Simplified for brevity but kept distinct
    while(deck.length < 99) deck.push({name:'Spell', types:['Spell'], produces:[]});
    return deck;
  };

  const runBtn = document.getElementById('runBtn');
  const workerUrl = URL.createObjectURL(new Blob([document.getElementById('worker-logic').textContent], {type: 'application/javascript'}));

  runBtn.onclick = () => {
    const total = parseInt(document.getElementById('iterInput').value);
    const cores = navigator.hardwareConcurrency || 4;
    const itersPer = Math.floor(total / cores);
    let finished = 0;
    let aggTurns = Array(9).fill(0);
    let aggColors = { W:0, B:0, R:0, Any:0 };

    document.getElementById('workerContainer').innerHTML = '';
    document.getElementById('turnChart').innerHTML = '';
    runBtn.disabled = true;

    for (let i = 0; i < cores; i++) {
      const div = document.createElement('div');
      div.className = 'worker-row';
      div.innerHTML = `<div class="thread-label">CORE ${i+1} <span id="pt-${i}">0%</span></div><div class="mini-progress"><div id="pb-${i}" class="mini-fill"></div></div>`;
      document.getElementById('workerContainer').appendChild(div);

      const w = new Worker(workerUrl);
      const iters = (i === cores-1) ? total - (itersPer*(cores-1)) : itersPer;
      w.postMessage({ iterations: iters, deckList: createDeck() });

      w.onmessage = (e) => {
        if (e.data.type === 'progress') {
          document.getElementById(`pb-${i}`).style.width = e.data.percent + '%';
          document.getElementById(`pt-${i}`).innerText = Math.round(e.data.percent) + '%';
        }
        if (e.data.type === 'result') {
          finished++;
          document.getElementById(`pb-${i}`).style.width = '100%'; // Forced complete
          document.getElementById(`pt-${i}`).innerText = '100%';
          e.data.turnSuccesses.forEach((val, idx) => aggTurns[idx] += val);
          Object.keys(aggColors).forEach(k => aggColors[k] += e.data.colorHitsAtT4[k]);
          w.terminate();
          if (finished === cores) render(aggTurns, aggColors, total);
        }
      };
    }
  };

  function render(turns, colors, total) {
    runBtn.disabled = false;
    const t4Pct = (turns[4]/total)*100;
    document.getElementById('resSuccess').innerText = t4Pct.toFixed(1) + '%';

    // Update Wheel SATURATION (using grayscale filter for fill effect)
    const avgSat = ((colors.W + colors.B + colors.R + colors.Any) / (total * 4));
    document.getElementById('manaWheel').style.filter = `grayscale(${1 - avgSat}) opacity(${0.2 + (avgSat * 0.8)})`;

    const chart = document.getElementById('turnChart');
    for(let t=1; t<=8; t++) {
      const pct = (turns[t]/total)*100;
      chart.innerHTML += `
                <div class="turn-row">
                    <div class="turn-meta"><span>TURN ${t}</span><span>${pct.toFixed(1)}%</span></div>
                    <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
                </div>`;
    }
  }
</script>
</body>
</html>
